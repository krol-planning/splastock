<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111526">
  <meta name="description" content="ストック制スプラの大会・対戦・チームストックをみんなで同期するWebアプリ">
  <title>SPLASTOCK — ストック制スプラ大会サポート</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="./config.js"></script>
  <script type="module" src="./app.js"></script>
</head>
<body>
  <div class="glow glow-a" aria-hidden="true"></div>
  <div class="glow glow-b" aria-hidden="true"></div>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="./" aria-label="SPLASTOCK ホーム"><span class="brand-icon">S<span class="dot">.</span></span><span class="brand-name">SPLA<span>STOCK</span><small>STOCK BATTLE MANAGER</small></span></a>
      <div id="header-right" class="header-right"><span class="status-chip"><span class="pulse"></span>読込中</span></div>
    </header>
    <main id="app" aria-live="polite"><section class="center-loading"><div class="spinner"></div><p>ブキ情報を読み込み中…</p></section></main>
    <footer class="footer"><span>SPLASTOCK • Community tournament tool</span><span>非公式ファン制作ツール / 任天堂とは無関係です</span></footer>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <dialog id="confirm-dialog" class="confirm-dialog"><form method="dialog" class="dialog-content"><div id="confirm-body"></div><div class="dialog-actions"><button value="cancel" class="btn btn-outline">キャンセル</button><button id="confirm-ok" value="confirm" class="btn btn-accent">確定する</button></div></form></dialog>
</body>
</html>
