<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#201a36">
  <title>ストック制スプラ</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #201a36;
      color: #fff;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; }
    .site-header {
      min-height: 64px;
      padding: 12px max(20px, calc((100% - 1120px) / 2));
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      background: #2b2341;
    }
    .brand { color: #c5ff65; font-weight: 800; text-decoration: none; }
    #header-right { display: flex; align-items: center; gap: 12px; }
    #app { min-height: calc(100vh - 64px); }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    .toast { display: none; }
    .toast.active {
      display: block;
      position: fixed;
      right: 16px;
      bottom: 16px;
      z-index: 10;
      max-width: min(440px, calc(100vw - 32px));
      padding: 12px 16px;
      border-radius: 10px;
      background: #c5ff65;
      color: #201a36;
    }
    .toast.error { background: #ff99b9; }
    dialog {
      width: min(520px, calc(100% - 32px));
      border: 1px solid #625878;
      border-radius: 16px;
      background: #342b4f;
      color: inherit;
    }
    dialog::backdrop { background: #100d1ccc; }
    #confirm-body { margin-bottom: 20px; }
    .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="./">SPLASTOCK</a>
    <div id="header-right"></div>
  </header>
  <main id="app" aria-live="polite"></main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <dialog id="confirm-dialog">
    <div id="confirm-body"></div>
    <form method="dialog" class="dialog-actions">
      <button class="btn btn-ghost" value="cancel">キャンセル</button>
      <button class="btn btn-accent" value="confirm">確認</button>
    </form>
  </dialog>
  <script src="./config.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
